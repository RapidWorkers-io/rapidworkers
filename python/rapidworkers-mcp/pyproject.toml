[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rapidworkers-mcp"
dynamic = ["version"]
description = "MCP server for RapidWorkers: let AI agents hire real people for AI data collection (photos, audio, video), app testing, surveys and microtasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "RapidWorkers" }]
keywords = [
    "mcp", "model-context-protocol", "mcp-server", "ai-agents", "human-in-the-loop",
    "crowdsourcing", "data-collection", "microtasks", "rapidworkers", "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21", "pytest-asyncio>=0.23"]

[project.scripts]
rapidworkers-mcp = "rapidworkers_mcp.server:main"

[project.urls]
Homepage = "https://www.rapidworkers.io/mcp/"
Documentation = "https://www.rapidworkers.io/developers/#mcp"
Source = "https://github.com/RapidWorkers-io/rapidworkers"
Issues = "https://github.com/RapidWorkers-io/rapidworkers/issues"

[tool.hatch.version]
path = "src/rapidworkers_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rapidworkers_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
