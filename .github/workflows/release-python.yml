# Publishes rapidworkers and rapidworkers-mcp to PyPI with trusted publishing.
# Trigger: push a tag like python-v0.1.0. No tokens: PyPI trusts this workflow
# (set up a pending publisher for each project: workflow release-python.yml,
# environment pypi).
name: Release Python

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_versions.py --tag "${GITHUB_REF_NAME}"
      - run: python3 scripts/codegen.py --check
      - run: python -m pip install build
      - run: python -m build python/rapidworkers --outdir dist
      - run: python -m build python/rapidworkers-mcp --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
