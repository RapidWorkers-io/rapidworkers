# Builds the MCP server image and pushes it to ghcr.io/rapidworkers-io/rapidworkers-mcp.
# Trigger: push a tag like docker-v0.1.0. Uses this repository's GITHUB_TOKEN.
name: Release Docker

on:
  push:
    tags: ["docker-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_versions.py --tag "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#docker-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rapidworkers-io/rapidworkers-mcp:${{ steps.version.outputs.value }}
            ghcr.io/rapidworkers-io/rapidworkers-mcp:latest
