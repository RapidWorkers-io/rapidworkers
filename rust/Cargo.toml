[workspace]
resolver = "2"
members = ["rapidworkers", "rapidworkers-mcp"]

[workspace.package]
# Each crate states its own version (scripts/check_versions.py reads it there)
edition = "2021"
authors = ["RapidWorkers"]
license = "MIT"
repository = "https://github.com/RapidWorkers-io/rapidworkers"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = "1.48"
wiremock = "0.6.5"
